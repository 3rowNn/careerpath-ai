# เสิร์ฟหน้าเว็บ + ส่ง /api ต่อให้ FastAPI (service "backend" ใน docker-compose)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # คำตอบแบบประเมิน / แชท ไม่ใหญ่ แต่เผื่อไว้
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI Advisor (Gemini โควตาฟรี) เรียกเครื่องมือหลายรอบ + อาจสลับโมเดลสำรอง — วัดได้ 70–160 วินาที
        # (backend จำกัด 60 วินาทีต่อการเรียก Gemini หนึ่งครั้ง) จึงให้เวลารอนานกว่าค่าเริ่มต้น 60s มาก
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ไฟล์ที่ Vite ใส่ hash ในชื่อ → cache ได้นาน
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: ทุก path ที่ไม่ใช่ไฟล์ → index.html (เช่น /careers/15-2051.00 ตอนรีเฟรช)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
